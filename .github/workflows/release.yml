name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm run packages:check
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$version" || {
            printf 'Tag %s does not match package version v%s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          }

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: npm run packages:stage
      - name: Ensure tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH" || {
            printf 'Tag %s must point to a commit on %s\n' "$RELEASE_TAG" "$DEFAULT_BRANCH" >&2
            exit 1
          }
      - name: Publish npm packages
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          for package_dir in . build/npm/claude build/npm/codex; do
            package_name=$(node -p "require('./$package_dir/package.json').name")
            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              printf '%s@%s is already published; skipping\n' "$package_name" "$version"
              continue
            fi
            npm publish "$package_dir" --access public --provenance
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
