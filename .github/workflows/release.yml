name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm run packages:check
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version" || {
            printf 'Tag %s does not match package version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          }

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: npm run packages:stage
      - name: Ensure tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            printf 'Tag %s must point to a commit on %s\n' "$GITHUB_REF_NAME" "$DEFAULT_BRANCH" >&2
            exit 1
          }
      - name: Publish npm packages
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          for package_dir in . build/npm/claude build/npm/codex; do
            package_name=$(node -p "require('./$package_dir/package.json').name")
            if npm view "$package_name@$version" version >/dev/null 2>&1; then
              printf '%s@%s is already published; skipping\n' "$package_name" "$version"
              continue
            fi
            npm publish "$package_dir" --access public --provenance
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
